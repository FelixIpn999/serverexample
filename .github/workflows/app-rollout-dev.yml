name: app-rollout-dev

on:
  workflow_run:
    workflows: ["app-build-push-dev"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: SHA del evento)"
        required: false
      task_memory:
        description: "Task memory (MB), ejemplo: 1024"
        required: true
        default: "1024"
      task_cpu:
        description: "Task CPU units, ejemplo: 512"
        required: true
        default: "512"

concurrency:
  group: app-rollout-dev
  cancel-in-progress: true

jobs:
  deploy-ecs-with-ansible:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "${{ secrets.AWS_ROLE_ARN_APP }}"
          aws-region: "${{ vars.AWS_REGION }}"

      - name: Resolve image tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.image_tag }}" ]; then
            IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            IMAGE_TAG="${{ github.event.workflow_run.head_sha }}"
          else
            IMAGE_TAG="${GITHUB_SHA}"
          fi
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build Ansible extra vars file
        run: |
          cat > extra-vars.json << 'EOF'
          {
            "aws_region": "${{ vars.AWS_REGION }}",
            "ecs_cluster_name": "${{ vars.ECS_CLUSTER_NAME }}",
            "ecs_service_name": "${{ vars.ECS_SERVICE_NAME }}",
            "ecs_task_family": "${{ vars.ECS_TASK_FAMILY }}",
            "ecs_container_name": "${{ vars.ECS_CONTAINER_NAME }}",
            "ecs_image_repository": "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY }}",
            "ecs_image_tag": "${{ steps.meta.outputs.image_tag }}",
            "ecs_task_cpu": "${{ github.event.inputs.task_cpu || '512' }}",
            "ecs_task_memory": "${{ github.event.inputs.task_memory || '1024' }}",
            "ecs_container_cpu": ${{ github.event.inputs.task_cpu || '512' }},
            "ecs_container_memory": ${{ github.event.inputs.task_memory || '1024' }},
            "ecs_container_port": 3000,
            "ecs_execution_role_arn": "${{ vars.ECS_EXECUTION_ROLE_ARN }}",
            "ecs_task_role_arn": "${{ vars.ECS_TASK_ROLE_ARN }}",
            "ecs_log_group": "${{ vars.ECS_LOG_GROUP }}",
            "ecs_log_stream_prefix": "${{ vars.ECS_LOG_STREAM_PREFIX }}",
            "ecs_environment_json": "${{ vars.ECS_ENV_VARS_JSON }}",
            "ecs_secrets_json": "${{ vars.ECS_SECRETS_JSON }}",
            "audit_log_dir": "artifacts"
          }
          EOF

      - name: Install Ansible and AWS SDK
        run: |
          python -m pip install --upgrade pip
          pip install "ansible>=9.0.0" boto3 botocore
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run Ansible rollout
        run: |
          ansible-playbook \
            -i ansible/inventory/hosts.yml \
            ansible/playbooks/update-ecs.yml \
            --extra-vars "@extra-vars.json"

      - name: Upload audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecs-audit-logs-${{ github.run_id }}
          path: artifacts/*.json