name: app-rollout-dev

on:
  workflow_run:
    workflows: ["app-build-push-dev"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (optional; defaults to SHA)"
        required: false
      task_memory:
        description: "Task memory (MB), example: 1024"
        required: true
        default: "1024"
      task_cpu:
        description: "Task CPU units, example: 512"
        required: true
        default: "512"

concurrency:
  group: app-rollout-dev
  cancel-in-progress: true

jobs:
  deploy-ecs-with-ansible:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "${{ secrets.AWS_ROLE_ARN_APP }}"
          aws-region: "${{ vars.AWS_REGION }}"

      - name: Resolve image tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.image_tag }}" ]; then
            IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            IMAGE_TAG="${{ github.event.workflow_run.head_sha }}"
          else
            IMAGE_TAG="${GITHUB_SHA}"
          fi
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build Ansible extra vars file
        run: |
          ENV_JSON='${{ vars.ECS_ENV_VARS_JSON }}'
          SECRETS_JSON='${{ vars.ECS_SECRETS_JSON }}'

          [ -z "$ENV_JSON" ] && ENV_JSON='[]'
          [ -z "$SECRETS_JSON" ] && SECRETS_JSON='[]'

          jq -n \
            --arg aws_region "${{ vars.AWS_REGION }}" \
            --arg ecs_cluster_name "${{ vars.ECS_CLUSTER_NAME }}" \
            --arg ecs_service_name "${{ vars.ECS_SERVICE_NAME }}" \
            --arg ecs_task_family "${{ vars.ECS_TASK_FAMILY }}" \
            --arg ecs_container_name "${{ vars.ECS_CONTAINER_NAME }}" \
            --arg ecs_image_repository "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY }}" \
            --arg ecs_image_tag "${{ steps.meta.outputs.image_tag }}" \
            --arg ecs_task_cpu "${{ github.event.inputs.task_cpu || '512' }}" \
            --arg ecs_task_memory "${{ github.event.inputs.task_memory || '1024' }}" \
            --argjson ecs_container_cpu ${{ github.event.inputs.task_cpu || '512' }} \
            --argjson ecs_container_memory ${{ github.event.inputs.task_memory || '1024' }} \
            --argjson ecs_container_port 3000 \
            --arg ecs_execution_role_arn "${{ vars.ECS_EXECUTION_ROLE_ARN }}" \
            --arg ecs_task_role_arn "${{ vars.ECS_TASK_ROLE_ARN }}" \
            --arg ecs_log_group "${{ vars.ECS_LOG_GROUP }}" \
            --arg ecs_log_stream_prefix "${{ vars.ECS_LOG_STREAM_PREFIX }}" \
            --arg ecs_environment_json "$ENV_JSON" \
            --arg ecs_secrets_json "$SECRETS_JSON" \
            --arg audit_log_dir "artifacts" \
            '{
              aws_region: $aws_region,
              ecs_cluster_name: $ecs_cluster_name,
              ecs_service_name: $ecs_service_name,
              ecs_task_family: $ecs_task_family,
              ecs_container_name: $ecs_container_name,
              ecs_image_repository: $ecs_image_repository,
              ecs_image_tag: $ecs_image_tag,
              ecs_task_cpu: $ecs_task_cpu,
              ecs_task_memory: $ecs_task_memory,
              ecs_container_cpu: $ecs_container_cpu,
              ecs_container_memory: $ecs_container_memory,
              ecs_container_port: $ecs_container_port,
              ecs_execution_role_arn: $ecs_execution_role_arn,
              ecs_task_role_arn: $ecs_task_role_arn,
              ecs_log_group: $ecs_log_group,
              ecs_log_stream_prefix: $ecs_log_stream_prefix,
              ecs_environment_json: $ecs_environment_json,
              ecs_secrets_json: $ecs_secrets_json,
              audit_log_dir: $audit_log_dir
            }' > extra-vars.json

          jq . extra-vars.json

      - name: Install Ansible and AWS SDK
        run: |
          python -m pip install --upgrade pip
          pip install "ansible>=9.0.0" boto3 botocore
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run Ansible rollout
        run: |
          ansible-playbook \
            -i ansible/inventory/hosts.yml \
            ansible/playbooks/update-ecs.yml \
            --extra-vars "@extra-vars.json"

      - name: Upload audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecs-audit-logs-${{ github.run_id }}
          path: artifacts/*.json