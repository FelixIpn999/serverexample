# .github/workflows/infra-apply-dev.yml
name: infra-apply-dev
on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
  workflow_dispatch:

concurrency:
  group: infra-apply-dev
  cancel-in-progress: true

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "${{ secrets.AWS_ROLE_ARN_INFRA }}"
          aws-region: "${{ vars.AWS_REGION }}"

      - name: Initialize Terraform with S3 backend
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_LOCK_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE }}
        run: |
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=state/${{ vars.ENVIRONMENT }}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=$TF_STATE_LOCK_TABLE" \
            -backend-config="encrypt=true"

      - name: Format check
        run: terraform fmt -check

      - name: Validate configuration
        run: terraform validate

      - name: Generate plan
        run: terraform plan -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: terraform/tfplan

      - name: Apply Terraform changes
        run: terraform apply tfplan

  sync-ecs-vars:
    needs: terraform-apply
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "${{ secrets.AWS_ROLE_ARN_INFRA }}"
          aws-region: "${{ vars.AWS_REGION }}"

      - name: Sync ECS_ENV_VARS_JSON and ECS_SECRETS_JSON
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }}
          CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
          TARGET_ENV: ${{ vars.ENVIRONMENT }}
        run: |
          set -euo pipefail

          CONTAINERS_JSON=$(aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query 'taskDefinition.containerDefinitions' \
            --output json)

          ECS_ENV_VARS_JSON=$(echo "$CONTAINERS_JSON" | jq -c --arg c "$CONTAINER_NAME" \
            'map(select(.name==$c))[0].environment // []')

          ECS_SECRETS_JSON=$(echo "$CONTAINERS_JSON" | jq -c --arg c "$CONTAINER_NAME" \
            'map(select(.name==$c))[0].secrets // []')

          gh variable set ECS_ENV_VARS_JSON --env "$TARGET_ENV" --body "$ECS_ENV_VARS_JSON"
          gh variable set ECS_SECRETS_JSON --env "$TARGET_ENV" --body "$ECS_SECRETS_JSON"

          echo "Synced variables in environment: $TARGET_ENV"