- name: Validate required variables
  ansible.builtin.assert:
    that:
      - aws_region | length > 0
      - ecs_cluster_name | length > 0
      - ecs_service_name | length > 0
      - ecs_task_family | length > 0
      - ecs_container_name | length > 0
      - ecs_image_repository | length > 0
      - ecs_image_tag | length > 0
      - ecs_execution_role_arn | length > 0
      - ecs_task_role_arn | length > 0
      - ecs_log_group | length > 0
    fail_msg: "Missing required ECS variables."


- name: Ensure audit log directory exists
  ansible.builtin.file:
    path: "{{ audit_log_dir }}"
    state: directory
    mode: "0750"

- name: Get current ECS service state (for audit baseline)
  community.aws.ecs_service_info:
    region: "{{ aws_region }}"
    cluster: "{{ ecs_cluster_name }}"
    service:
      - "{{ ecs_service_name }}"
  register: current_service_info

- name: Set previous task definition ARN
  ansible.builtin.set_fact:
    old_task_definition_arn: >-
      {{
        current_service_info.service.taskDefinition
        | default((current_service_info.services | default([]) | first).taskDefinition | default('unknown'))
      }}

- name: Register new ECS task definition revision
  community.aws.ecs_taskdefinition:
    state: present
    region: "{{ aws_region }}"
    family: "{{ ecs_task_family }}"
    network_mode: awsvpc
    launch_type: FARGATE
    execution_role_arn: "{{ ecs_execution_role_arn }}"
    task_role_arn: "{{ ecs_task_role_arn }}"
    cpu: "{{ ecs_task_cpu }}"
    memory: "{{ ecs_task_memory }}"
    containers:
      - name: "{{ ecs_container_name }}"
        image: "{{ ecs_image_repository }}:{{ ecs_image_tag }}"
        essential: true
        cpu: "{{ ecs_container_cpu }}"
        memory: "{{ ecs_container_memory }}"
        portMappings:
          - containerPort: "{{ ecs_container_port }}"
            hostPort: "{{ ecs_container_port }}"
            protocol: tcp
        environment: "{{ ecs_environment }}"
        secrets: "{{ ecs_secrets }}"
        logConfiguration:
          logDriver: awslogs
          options:
            awslogs-group: "{{ ecs_log_group }}"
            awslogs-region: "{{ aws_region }}"
            awslogs-stream-prefix: "{{ ecs_log_stream_prefix }}"
  register: ecs_td_result

- name: Resolve new task definition ARN
  ansible.builtin.set_fact:
    new_task_definition_arn: >-
      {{
        ecs_td_result.taskdefinition.taskDefinitionArn
        | default(ecs_td_result.taskdefinition.task_definition_arn
        | default(ecs_td_result.taskdefinition_arn))
      }}

- name: Update ECS service to new task definition
  community.aws.ecs_service:
    state: present
    region: "{{ aws_region }}"
    cluster: "{{ ecs_cluster_name }}"
    name: "{{ ecs_service_name }}"
    task_definition: "{{ new_task_definition_arn }}"
    force_new_deployment: true
    wait: true
    wait_timeout: 900
  register: ecs_service_result

- name: Write audit log file
  ansible.builtin.template:
    src: audit-log.json.j2
    dest: "{{ audit_log_dir }}/ecs-update-{{ ansible_date_time.iso8601_basic_short }}.json"
    mode: "0640"